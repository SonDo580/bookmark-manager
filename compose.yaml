services:
  redis:
    image: redis:alpine
    container_name: bookmark-service-redis
    ports:
      - "6380:6379"

  bookmark_service:
    image: bookmark_service:dev
    build: .
    container_name: bookmark-service
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379