basePath: /
definitions:
  dto.ErrorResponse:
    properties:
      details: {}
      message:
        type: string
    type: object
  dto.HealthCheckResponse:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      data:
        type: string
      message:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      display_name:
        maxLength: 100
        type: string
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 100
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  dto.RegisterResponse:
    properties:
      data:
        $ref: '#/definitions/model.User'
      message:
        type: string
    type: object
  dto.ShortenURLRequest:
    properties:
      exp_seconds:
        maximum: 86400
        minimum: 0
        type: integer
      url:
        type: string
    required:
    - url
    type: object
  dto.ShortenURLResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: API for managing bookmark
  title: Bookmark Manager API
  version: 1.0.0
paths:
  /health-check:
    get:
      description: Check status of application and dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Health check
      tags:
      - health
  /v1/links/redirect/{code}:
    get:
      description: Redirect to original URL.
      parameters:
      - description: Shortened code
        in: path
        name: code
        required: true
        type: string
      responses:
        "301":
          description: Moved permanently
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Redirect to original URL
      tags:
      - link
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate a shortened URL from the original URL.
      parameters:
      - description: Input required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ShortenURLRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ShortenURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Generate a shortened URL
      tags:
      - link
  /v1/users/login:
    post:
      consumes:
      - application/json
      description: Return token if credential is correct.
      parameters:
      - description: Input required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login
      tags:
      - user
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Register a new user.
      parameters:
      - description: Input required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register a new user
      tags:
      - user
swagger: "2.0"
