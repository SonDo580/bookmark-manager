basePath: /
definitions:
  model.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  model.HealthCheckResponse:
    properties:
      instance_id:
        type: string
      message:
        $ref: '#/definitions/model.HealthStatus'
      service_name:
        type: string
    type: object
  model.HealthStatus:
    enum:
    - OK
    type: string
    x-enum-varnames:
    - HealthStatusOK
  model.ShortenURLRequest:
    properties:
      exp_seconds:
        type: integer
      url:
        type: string
    type: object
  model.ShortenURLResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: API for managing bookmark
  title: Bookmark Manager API
  version: 1.0.0
paths:
  /health-check:
    get:
      description: Check status of application and dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthCheckResponse'
      summary: Health check
      tags:
      - health
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate a shortened URL from the original URL.
      parameters:
      - description: Input required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ShortenURLRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.ShortenURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Generate a shortened URL
      tags:
      - link
swagger: "2.0"
