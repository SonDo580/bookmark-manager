basePath: /
definitions:
  dto.ErrorResponse:
    properties:
      details: {}
      message:
        type: string
    type: object
  dto.HealthCheckResponse:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  handler.ShortenURLRequest:
    properties:
      exp_seconds:
        maximum: 86400
        minimum: 0
        type: integer
      url:
        type: string
    required:
    - url
    type: object
  handler.ShortenURLResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: API for managing bookmark
  title: Bookmark Manager API
  version: 1.0.0
paths:
  /health-check:
    get:
      description: Check status of application and dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Health check
      tags:
      - health
  /v1/links/redirect/{code}:
    get:
      description: Redirect to original URL.
      parameters:
      - description: Shortened code
        in: path
        name: code
        required: true
        type: string
      responses:
        "301":
          description: Moved permanently
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Redirect to original URL
      tags:
      - link
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate a shortened URL from the original URL.
      parameters:
      - description: Input required
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ShortenURLRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ShortenURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Generate a shortened URL
      tags:
      - link
swagger: "2.0"
